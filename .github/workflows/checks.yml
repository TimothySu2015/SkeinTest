name: checks
on: pull_request
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fails when a file named FAIL is there
        run: test ! -e FAIL
